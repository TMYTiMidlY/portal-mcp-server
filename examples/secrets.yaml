# ─────────────────────────────────────────────────────────────────────────────
# portal-mcp-server  |  secrets.example.yaml
# Copy this file to secrets.yaml and fill in your own values.
# NEVER put the secret VALUE here — only a `command:` that PRINTS it to stdout.
# secrets.yaml itself contains no secrets, so it is safe to keep in config.
# ─────────────────────────────────────────────────────────────────────────────
#
# A "secret" is a named value (an API token, a deploy key, ...) that the agent
# needs a command to USE but must never SEE: the value must not enter the
# model's context / tool-call trace, and must not be sent to the LLM backend.
#
# The agent references a secret by NAME via the tools' `secrets` parameter:
#
#     portal_bash(host="web01",
#                 command='curl -H "Authorization: Bearer $GITHUB_TOKEN" ...',
#                 secrets=["github_token"])
#
#     portal_local_exec(command='gh api user',     # needs PORTAL_ALLOW_LOCAL_EXEC=1
#                       secrets=["github_token"])
#
# The server resolves the value and injects it as an environment variable named
# after the secret, UPPERCASED:  github_token -> $GITHUB_TOKEN
# (non-[A-Za-z0-9_] characters become _, a leading digit is prefixed with _).
# The value is passed via the process environment / SSH stdin (never on argv,
# so it stays out of `ps` and the audit log) and any echo of it in the command
# output is redacted to *** before the result is returned to the agent.
#
# Two sources (checked in this order):
#   1. The per-user credential broker TTL cache, populated out-of-band by
#        portal-mcp-server secret-set <name>
#      (prompts with no echo in a separate terminal, TTL-cached, never on disk).
#   2. The `command:` below (a shell command that prints the secret to stdout),
#      mirroring hosts.yaml `password_command`.

secrets:

  # ── From a password manager (recommended) ────────────────────────────────
  # github_token:
  #   command: "pass show api/github"          # -> injected as $GITHUB_TOKEN

  # ── Shorthand: map a name straight to a command string ───────────────────
  # openai_api_key: "op read op://Private/OpenAI/credential"   # -> $OPENAI_API_KEY

  # ── From an env var already present in the SERVER's environment ──────────
  # (handy for CI; still kept out of the model because the agent only sees the
  #  name, and the resolved value is redacted from output)
  # ci_deploy_token:
  #   command: 'printf %s "$CI_DEPLOY_TOKEN"'   # -> injected as $CI_DEPLOY_TOKEN

  # ── No command at all: provided live via `secret-set` ────────────────────
  # A secret with no `command:` is loaded but can only be supplied at runtime
  # with `portal-mcp-server secret-set ephemeral_token` (TTL cache). Good for
  # short-lived tokens you do not want to wire into a password manager.
  # ephemeral_token: {}
