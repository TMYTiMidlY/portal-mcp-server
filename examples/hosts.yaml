# ─────────────────────────────────────────────────────────────────────────────
# portal-mcp-server  |  hosts.yaml (example)
# Copy this file to $XDG_CONFIG_HOME/portal-mcp-server/hosts.yaml
# (default ~/.config/portal-mcp-server/hosts.yaml) and fill in your own values.
# NEVER commit hosts.yaml — it contains real credentials.
# Dynamic registration is also available via the portal_host MCP tool
# (key-based hosts only — see README §Authentication).
# ─────────────────────────────────────────────────────────────────────────────

hosts:

  # ── Local machine ────────────────────────────────────────────────────────
  # Useful for testing and local automation.
  # Requires SSH server running on localhost (e.g. openssh-server).
  localhost:
    host: 127.0.0.1
    port: 22
    user: your-username
    key: ~/.ssh/id_ed25519
    tags: [local]
    # Host-key verification — defaults to True (strict). Set this to False
    # ONLY for ephemeral test environments. With strict=true, asyncssh uses
    # ~/.ssh/known_hosts; you can override the file with `known_hosts:`.
    # strict_host_key_checking: true
    # known_hosts: ~/.ssh/known_hosts

  # ── Remote web server (key auth — RECOMMENDED) ───────────────────────────
  web01:
    host: 10.0.0.10
    port: 22
    user: deploy
    key: ~/.ssh/deploy_key
    tags: [web, production]

  # ── Database server ──────────────────────────────────────────────────────
  db01:
    host: 10.0.0.20
    port: 22
    user: deploy
    key: ~/.ssh/deploy_key
    tags: [database, production]

  # ── Staging environment ──────────────────────────────────────────────────
  staging:
    host: 192.168.1.50
    port: 2222
    user: deploy
    key: ~/.ssh/staging_key
    tags: [staging]

  # ── Encrypted private key with ssh-agent (RECOMMENDED for encrypted keys) ─
  # Run `ssh-add ~/.ssh/encrypted_key` once; asyncssh picks the unlocked key
  # up via $SSH_AUTH_SOCK automatically — no extra config needed below.
  # If you cannot use ssh-agent (headless / CI), uncomment passphrase_command:
  # encrypted-key-host:
  #   host: 10.0.0.30
  #   user: deploy
  #   key: ~/.ssh/encrypted_key
  #   # passphrase_command: pass show ssh/encrypted_key
  #   tags: [encrypted-key]

  # ── Password auth (legacy hosts only — see README §Authentication) ───────
  # Two non-negotiable rules:
  #   1. NEVER write `password: ...` in this file. Plaintext password
  #      fields are rejected at startup with an ERROR log.
  #   2. The MCP `portal_host(action="register", ...)` tool does NOT accept
  #      a password — yaml is the only entry point, so the secret cannot
  #      land in LLM tool-call traces.
  # Two sources for the password (order: agent cache → password_command
  # → error):
  #   - `password_command` (this file): shell command that prints the
  #     password to stdout. Same pattern as Borg's BORG_PASSCOMMAND and
  #     restic's RESTIC_PASSWORD_COMMAND. A single trailing newline is
  #     stripped.
  #   - `portal ssh set <host>` (out-of-band): getpass prompt
  #     in a separate terminal pushes the password into the per-user
  #     systemd credential agent (per-host key, default TTL 900s). Works
  #     even when `password_command` is not set, AND for key-mode hosts
  #     (the default — no `auth:` field below) as an automatic fallback
  #     if asyncssh raises PermissionDenied. Requires `portal agent
  #     install --now` once per user session.
  # legacy-host:
  #   host: 10.0.0.40
  #   user: admin
  #   auth: password
  #   # CI / env-var pattern (GitHub Secrets, Vault, etc.):
  #   password_command: printf '%s' "$LEGACY_HOST_PASSWORD"
  #   # Or pull from a password manager:
  #   # password_command: pass show ssh/legacy-host
  #   # password_command: bw get password legacy-host
  #   # password_command: op read "op://Private/legacy-host/password"
  #   tags: [legacy]

  # ── Non-interactive sudo (portal_exec use_sudo=True) ─────────────────────
  # Run sudo on a remote host WITHOUT the password ever becoming a tool
  # parameter or hitting a log. The password is fed over the existing SSH
  # channel to `sudo -S` on stdin. Two ways to provide it:
  #   (a) sudo_password_command (below) — a shell command that prints the
  #       sudo password to stdout. Fully automatic; same contract as
  #       password_command (one trailing newline stripped, 10s timeout).
  #   (b) Out-of-band agent — no yaml needed. In a terminal run:
  #         portal sudo set sudo-box           # hidden getpass
  #         portal sudo set sudo-box --ttl 1800  # TTL secs (default 900)
  #       which pushes the password into the per-user systemd credential
  #       agent (TTL-cached, never on disk). Requires `portal agent
  #       install --now` once per user session.
  # Lookup order at sudo time: agent cache (b) -> sudo_password_command
  # (a) -> error. NOTE: use_sudo runs a one-shot `sudo -S -k` exec, so it does
  # NOT inherit the cwd/env of your persistent portal_shell session.
  # sudo-box:
  #   host: 10.0.0.50
  #   user: deploy
  #   key: ~/.ssh/deploy_key
  #   # Path (a): pull the sudo password from a manager / env var.
  #   sudo_password_command: pass show sudo/sudo-box
  #   # sudo_password_command: op read "op://Private/sudo-box/password"
  #   # sudo_password_command: printf '%s' "$SUDO_BOX_PASSWORD"
  #   tags: [sudo]

  # ── Jump host / bastion ──────────────────────────────────────────────────
  # bastion:
  #   host: bastion.example.com
  #   port: 22
  #   user: ops
  #   key: ~/.ssh/id_ed25519
  #   tags: [bastion, jump]

