[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portal-mcp-server"
version = "1.0.0"
description = "Portal MCP Server — agent-feels-local SSH orchestration over AsyncSSH + FastMCP (18 tools)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "jaguar999paw-droid" },
    { name = "TMYTiMidlY" },
]
keywords = ["mcp", "ssh", "asyncssh", "ai-agents", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "asyncssh>=2.14.0",
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0.1",
    "uvicorn[standard]>=0.29.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
portal-mcp-server = "portal_mcp_server:main"

[project.urls]
Homepage = "https://github.com/TMYTiMidlY/portal-mcp-server"
Repository = "https://github.com/TMYTiMidlY/portal-mcp-server"
Issues = "https://github.com/TMYTiMidlY/portal-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["portal_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "/portal_mcp_server",
    "/README.md",
    "/README.en.md",
    "/LICENSE",
    "/NOTICE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CONTRIBUTING.en.md",
    "/config/hosts.example.yaml",
    "/config/policies.yaml",
    "/docs",
    "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
